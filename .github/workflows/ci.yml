name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
  docker:
    runs-on: ubuntu-24.04
    needs: check
    env:
      KOD_DOCKER_TESTS: "1"
      KOD_API_KEY: test-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - run: docker build -t kod-llm-proxy --build-arg RUST_VERSION=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml) -f images/proxy/Dockerfile .
      - run: docker build -t kod-sandbox-test --build-arg RUST_VERSION=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml) --build-arg EXTRA_PACKAGES=curl -f images/sandbox/Dockerfile .
      - run: cargo test -p kod-eval --test docker --test gateway_down --test kill_switch --test kod_loop
  gates:
    runs-on: ubuntu-24.04
    needs: check
    env:
      KOD_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t kod-gates-test -f images/gates/Dockerfile .
      - run: KOD_GATE_TEST_IMAGE=$(docker image inspect kod-gates-test --format '{{.Id}}') KOD_DOCKER_BIN=$(command -v docker) cargo test -p kod-gates
