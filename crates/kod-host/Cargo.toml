[package]
name = "kod-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["net", "signal", "sync", "time", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
kod-eval = { path = "../kod-eval" }
kod-loop = { path = "../kod-loop" }
kod-llm-proxy = { path = "../kod-llm-proxy" }
kod-dispatcher = { path = "../kod-dispatcher" }
kod-tracker = { path = "../kod-tracker" }
kod-tool-gateway = { path = "../kod-tool-gateway" }
kod-gates = { path = "../kod-gates" }
kod-status = { path = "../kod-status" }
kod-audit = { path = "../kod-audit" }
kod-policy = { path = "../kod-policy" }

tempfile = { version = "3", optional = true }
base64 = { version = "0.22", optional = true }
hmac = { version = "0.12", optional = true }

[features]
connected-test-support = ["test-support", "kod-tool-gateway/test-support", "kod-tracker/test-support", "dep:tempfile", "dep:hmac", "dep:base64"]
# Lets tests install a collection; production code cannot forge one.
test-support = []

[dev-dependencies]
kod-host = { path = ".", features = ["test-support"] }
tempfile = "3"
kod-tool-gateway = { path = "../kod-tool-gateway", features = ["test-support"] }
kod-tracker = { path = "../kod-tracker", features = ["test-support"] }
kod-eval = { path = "../kod-eval", features = ["connected-test-support"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }
futures-util = "0.3"

[[test]]
name = "connected_docker"
required-features = ["connected-test-support"]

[[test]]
name = "connected_http"
required-features = ["connected-test-support"]

[[test]]
name = "connected_preflight"
required-features = ["connected-test-support"]

[[test]]
name = "connected_bounded"
required-features = ["connected-test-support"]

[[test]]
name = "connected_secret"
required-features = ["connected-test-support"]
