[package]
name = "kod-tracker"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
test-support = []

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
