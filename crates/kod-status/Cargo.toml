[package]
name = "kod-status"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "kod"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
kod-audit = { path = "../kod-audit" }
kod-dispatcher = { path = "../kod-dispatcher" }
kod-gates = { path = "../kod-gates" }
kod-tracker = { path = "../kod-tracker" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
