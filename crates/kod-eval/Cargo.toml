[package]
name = "kod-eval"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
roxmltree = "0.20"
serde_json = "1"
toml = "0.9"

[dev-dependencies]
axum = "0.8"
kod-llm-proxy = { path = "../kod-llm-proxy" }
kod-loop = { path = "../kod-loop" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[features]
connected-test-support = []
